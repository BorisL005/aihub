name: Release tag

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full tag history is required - a shallow checkout may not include
          # the commits earlier tags point at, so "reachable from master"
          # couldn't be computed correctly.
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compute next tag
        id: next_tag
        run: |
          set -euo pipefail
          # Capturing into a variable first (rather than echoing the command
          # substitution directly) means a script failure fails THIS step -
          # "echo tag=$(...)" always exits 0 regardless of the script.
          tag=$(node .github/workflows/scripts/print-next-tag.js)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          TAG: ${{ steps.next_tag.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
