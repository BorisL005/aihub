name: Receipt eval sync and validate

on:
  pull_request:
  push:
    branches:
      - develop
      - master

jobs:
  receipt-eval-sync-validate:
    name: receipt-eval-sync-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run eval script unit tests
        working-directory: evals/extraction/receipts/scripts
        run: node --test

      - name: Sync eval set from R2
        working-directory: evals/extraction/receipts
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_DEFAULT_REGION: auto
        run: aws s3 sync s3://aihub-evals/receipts/ . --endpoint-url "$R2_ENDPOINT"

      - name: Validate synced eval set
        id: validate
        working-directory: evals/extraction/receipts
        run: node scripts/validate-pairs.js .

      # AC-8/AC-3 owner ruling: a validation failure must fail the job before
      # extraction/comparison ever runs (partial metrics on an incomplete set
      # would lie) - so this step never gets an `if: always()`. Instead the
      # validation step above owns writing the failure report, and this step
      # attaches it so the job still ends red with the report visible.
      - name: Upload validation failure report
        if: failure() && steps.validate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: receipt-eval-validation-report
          path: evals/extraction/receipts/validation-report.txt
          if-no-files-found: error

      - name: Run per-pair comparison
        working-directory: evals/extraction/receipts
        run: node scripts/run-eval.js .
