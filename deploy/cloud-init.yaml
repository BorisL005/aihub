#cloud-config
# Provisions a fresh Hetzner CX23 node for the AI Hub staging stack (KAN-12).
# The deploy key's public half is already in root's authorized_keys - this
# file does not manage SSH keys or users. The only thing it needs to do is
# install Docker Engine + the Compose plugin; deploy-staging.yml handles
# everything else (syncing config, pulling/starting the stack).

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - rsync

runcmd:
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL "https://download.docker.com/linux/$(. /etc/os-release && echo "$ID")/gpg" -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - >
    echo
    "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc]
    https://download.docker.com/linux/$(. /etc/os-release && echo "$ID") $(. /etc/os-release && echo "$VERSION_CODENAME") stable"
    > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
